<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>막차</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #d8d4c8; overflow: hidden;
    font-family: Gulim, "굴림", Dotum, "돋움", AppleGothic, sans-serif; -webkit-font-smoothing: none; font-smooth: never; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }

  #stage { position: relative; width: min(100vw, 150vh, 960px); aspect-ratio: 3 / 2; background: #000; overflow: hidden; }
  #stage.shake { animation: shake .08s infinite; }
  @keyframes shake { 0% { transform: translate(-1.2%, .8%) scale(1.04); } 50% { transform: translate(1.4%, -1%) scale(1.06); } 100% { transform: translate(-.6%, 1.2%) scale(1.04); } }

  #bg, #bg2 { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .6s; }
  #bg2 { opacity: 0; }
  #bg, #bg2, #scare { filter: contrast(1.28) saturate(.42) brightness(.9); }
  #stage:fullscreen { width: 100vw; }
  #world { position: absolute; inset: 0; transition: filter .5s; }
  #world.flicker { animation: flicker 3.7s infinite; }
  #world.dark { filter: brightness(.25); }
  @keyframes flicker { 0%, 100% { filter: brightness(1); } 41% { filter: brightness(1); } 42% { filter: brightness(.55); } 43% { filter: brightness(1); } 77% { filter: brightness(.95); } 78% { filter: brightness(.4); } 79.5% { filter: brightness(1); } 80% { filter: brightness(.7); } 81% { filter: brightness(1); } }

  /* 귀신·손 등 합성 레이어 */
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #fx img { position: absolute; mix-blend-mode: screen; transition: opacity .8s, transform 1.2s; }
  #mirrorText { position: absolute; left: 30%; top: 30%; width: 40%; text-align: center; font-size: clamp(16px, 4.2vw, 46px);
    font-family: "Nanum Pen Script", "Apple SD Gothic Neo", cursive; color: rgba(225, 235, 230, .0); letter-spacing: .2em;
    filter: blur(1.2px); transform: rotate(-3deg); transition: color 3s; pointer-events: none; }
  #mirrorText.on { color: rgba(225, 235, 230, .62); }
  #fog { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, rgba(200, 215, 210, .28), transparent 55%); opacity: 0; transition: opacity 3s; pointer-events: none; }
  #fog.on { opacity: 1; }

  .hot { position: absolute; cursor: pointer; }
  .hot::after { content: attr(data-label); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: clamp(11px, 1.5vw, 15px); color: #fff; background: rgba(0, 0, 0, .6); padding: .25em .7em; border-radius: 2px;
    white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .hot:hover::after { opacity: 1; }
  .hot:not(.nolabel)::after { opacity: .8; top: calc(50% + 1.5em); }
  .hot::before { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: rgba(255, 255, 255, .8); box-shadow: 0 0 9px 4px rgba(255, 255, 255, .3); animation: pulse 1.8s infinite; pointer-events: none; }
  .hot:hover::before, .hot.nolabel::before { display: none; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  .hot.target::before { width: 13px; height: 13px; margin: -6.5px; background: #f33; box-shadow: 0 0 10px 5px rgba(255, 40, 40, .45); }
  .hot.target::after { opacity: 1 !important; background: #900; color: #fff; content: '▶ ' attr(data-label); }
  .nav.target { border-color: #f33; color: #fff; box-shadow: 0 0 8px 2px rgba(255, 40, 40, .5); }
  #goal { position: absolute; left: 50%; top: 5.6%; transform: translateX(-50%); font-size: clamp(11px, 1.5vw, 15px); color: #d9b1a4; background: rgba(0, 0, 0, .55); padding: .2em .9em; pointer-events: none; white-space: nowrap; }
  #goal:empty { display: none; }
  body.debug .hot { outline: 1px dashed #f33; background: rgba(255, 0, 0, .12); }
  body.debug .hot::after { opacity: 1; }

  .nav { position: absolute; cursor: pointer; padding: .5em 1em; font-size: clamp(12px, 1.6vw, 17px); color: #cfcab8;
    background: #000; border: 1px solid #777; }
  .nav:hover { background: #600; color: #fff; }
  .nav.left { left: 1.5%; top: 46%; } .nav.right { right: 1.5%; top: 46%; }
  .nav.down { left: 50%; bottom: 4%; transform: translateX(-50%); } .nav.up { left: 50%; top: 9%; transform: translateX(-50%); }
  .nav.left2 { left: 1.5%; top: 60%; }

  #grain { position: absolute; inset: -50%; pointer-events: none; opacity: .22; animation: grain .5s steps(4) infinite;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
  @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-4%, 3%); } 50% { transform: translate(3%, -5%); } 75% { transform: translate(-2%, -3%); } 100% { transform: translate(4%, 2%); } }
  #vig { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(rgba(0, 0, 0, .2) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .78) 100%); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; }
  #white { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* HUD */
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 1.2% 1.5%; pointer-events: none; }
  #inv { display: flex; gap: .5em; pointer-events: auto; }
  .item { padding: .35em .8em; font-size: clamp(11px, 1.5vw, 15px); background: rgba(0, 0, 0, .6); border: 1px solid rgba(207, 202, 184, .3); cursor: pointer; }
  .item:hover { border-color: #b33; color: #fff; }
  #tools { display: flex; gap: .5em; pointer-events: auto; }
  #tools button, #btnBag { background: rgba(0, 0, 0, .6); color: #cfcab8; border: 1px solid rgba(207, 202, 184, .3); padding: .35em .7em; font: inherit; font-size: clamp(11px, 1.4vw, 14px); cursor: pointer; }
  #hud { z-index: 5; align-items: flex-start; }
  body:not(.playing) #inv, body:not(.playing) #btnHint, body:not(.playing) #btnFull { visibility: hidden; }
  #title .tOpt { left: 7%; top: 82%; margin: 0; padding: 0; border: 0; background: none; color: #999; font-size: clamp(11px, 1.5vw, 14px); letter-spacing: 0; }
  #title .tOpt:hover { background: none; color: #fff; }
  #loc { display: none; }
  #goal { top: 1.8% !important; height: 2.4em; line-height: calc(2.4em - 2px); padding: 0 1em !important; font-size: clamp(11px, 1.4vw, 14px) !important; background: #000 !important; border: 1px solid #555; color: #cfcab8 !important; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
  #goal b { color: #d9a090; font-weight: 400; }
  #tools { align-items: flex-start; }
  #scare, #white { z-index: 6; }
  #tools button, #btnBag { width: 2.4em; height: 2.4em; padding: .45em !important; display: flex; align-items: center; justify-content: center; }
  #tools svg, #btnBag svg { width: 100%; height: 100%; }
  #btnMute .off { display: none; } #btnMute.muted .off { display: inline; } #btnMute.muted .on { display: none; } #btnMute.muted { color: #777; }
  #inv { position: relative; display: block; }
  #btnBag { position: relative; }
  #btnHint.nudge { border-color: #f33; background: #a00; color: #fff; }
  #btnBag.new { border-color: #f33; background: #a00; color: #fff; }
  #bagN { position: absolute; right: -.55em; top: -.55em; min-width: 1.3em; line-height: 1.3em; background: #900; color: #fff; font-size: .8em; text-align: center; }
  #bagN:empty { display: none; }
  #bagList { display: none; position: absolute; left: 0; top: calc(100% + 6px); background: #000; border: 1px solid #999; padding: 0; min-width: 10em; }
  #inv.open #bagList { display: block; }
  #bagList .item { display: block; background: none; border: 0; border-bottom: 1px dotted #555; padding: 8px 10px; white-space: nowrap; }
  #bagList .item:last-child { border-bottom: 0; }
  #bagList .item:hover { background: #600; }
  #bagList .empty { padding: 8px 10px; color: #777; font-size: clamp(11px, 1.5vw, 15px); white-space: nowrap; }
  #bagList .cap { padding: 6px 10px; color: #999; font-size: clamp(10px, 1.2vw, 12px); border-bottom: 1px solid #555; }
  #ov { z-index: 7; } #end { z-index: 6; }
  .poster h2 { white-space: nowrap; font-size: 1.7em !important; letter-spacing: .08em !important; }
  #loc { position: absolute; left: 50%; top: 1.6%; transform: translateX(-50%); font-size: clamp(11px, 1.4vw, 14px); color: #999; pointer-events: none; }

  /* 대사창 */
  #dlg { position: absolute; left: 4%; right: 4%; bottom: 3%; min-height: 13%; padding: 1em 1.2em; background: #000;
    border: 1px solid #999; font-size: clamp(13px, 2vw, 21px); line-height: 1.6; display: none; cursor: pointer; white-space: pre-wrap; }
  #dlg.on { display: block; }
  #dlg .more { position: absolute; right: 1em; bottom: .5em; font-size: .7em; opacity: .6; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #choices { display: flex; gap: .8em; margin-top: .8em; flex-wrap: wrap; }
  #choices button { background: #111; color: #d8d4c8; border: 1px solid rgba(207, 202, 184, .4); padding: .45em 1.1em; font: inherit; font-size: .9em; cursor: pointer; }
  #choices button:hover { background: #6a1414; color: #fff; }
  #blocker { position: absolute; inset: 0; display: none; }
  #blocker.on { display: block; }

  /* 오버레이 (전단, 휴대폰, 키패드) */
  #ov { position: absolute; inset: 0; background: rgba(0, 0, 0, .82); display: none; align-items: center; justify-content: center; }
  #ov.on { display: flex; }
  #ovBody { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #ovClose { position: absolute; right: 3%; top: 4%; width: 2.4em; height: 2.4em; padding: .5em; background: #000; border: 1px solid #999; color: #d8d4c8; font: inherit; font-size: clamp(11px, 1.4vw, 14px); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #ovClose:hover { background: #600; color: #fff; }
  #ovClose svg { width: 100%; height: 100%; }

  .poster { width: 34%; aspect-ratio: 3 / 4.3; background: #d9d2b8; color: #2a241b; padding: 3% 3%; transform: rotate(-1.5deg); text-align: center;
    box-shadow: 0 0 60px rgba(0, 0, 0, .9); font-size: clamp(9px, 1.35vw, 15px); line-height: 1.55; filter: sepia(.35) contrast(.95); position: relative; }
  .poster h2 { font-size: 2.1em; letter-spacing: .25em; color: #7a1010; border-bottom: 2px solid #7a1010; padding-bottom: .2em; margin-bottom: .5em; }
  .poster img { width: 46%; aspect-ratio: 3 / 4; object-fit: cover; filter: grayscale(.7) contrast(.9); border: 1px solid #554; }
  .poster .name { font-size: 1.6em; font-weight: 700; margin: .3em 0; letter-spacing: .3em; }
  .poster .smudge { background: #3a342a; color: transparent; filter: blur(2px); border-radius: 40%; }
  .poster .tag { position: absolute; left: 50%; top: 56.5%; transform: translateX(-50%) rotate(2deg); background: #f4f1e6; border: 1px solid #333; padding: .1em 1em;
    font-size: 1.5em; font-weight: 700; letter-spacing: .4em; box-shadow: 2px 3px 6px rgba(0, 0, 0, .5); }

  .phone { width: 22%; aspect-ratio: 9 / 17; background: #0b0c0e; border: 3px solid #26282c; border-radius: 9%; padding: 4% 2%; font-size: clamp(8px, 1.15vw, 13px); display: flex; flex-direction: column; gap: .6em; box-shadow: 0 0 50px #000; }
  .phone .bar { display: flex; justify-content: space-between; opacity: .7; font-size: .85em; }
  .phone .time { font-size: 3em; text-align: center; font-weight: 200; margin: .2em 0; }
  .phone .msg { background: #1c1e22; border-radius: .6em; padding: .6em .8em; line-height: 1.5; }
  .phone .msg b { display: block; font-size: .85em; opacity: .6; font-weight: 400; }
  .phone .msg.red { background: #3a0c0c; color: #ffd9d9; }

  .keypad { background: #17181a; border: 1px solid #444; padding: 1.6em; text-align: center; box-shadow: 0 0 50px #000; }
  .keypad .num { font-size: .9em; opacity: .7; letter-spacing: .3em; margin-bottom: .6em; }
  .keypad .disp { font-family: Menlo, monospace; font-size: 2em; letter-spacing: .4em; background: #050805; color: #7dff8a; padding: .2em .5em; margin-bottom: .7em; min-height: 1.6em; }
  .keypad .keys { display: grid; grid-template-columns: repeat(3, 3.2em); gap: .4em; justify-content: center; }
  .keypad button { height: 2.6em; background: #2a2c30; color: #ddd; border: 1px solid #555; font: inherit; font-size: 1.1em; cursor: pointer; }
  .keypad button:active { background: #6a1414; }

  /* 깜짝 */
  #scare { position: absolute; inset: 0; background: #000 center / cover no-repeat; display: none; }
  #scare.on { display: block; animation: zoom .9s ease-out; }
  @keyframes zoom { 0% { transform: scale(.7); filter: brightness(2.4) contrast(1.4); } 12% { transform: scale(1.15); } 100% { transform: scale(1.35); filter: brightness(1) contrast(1.2); } }

  /* 화면들 */
  .screen { position: absolute; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.2em; padding: 6%; }
  .screen.on { display: flex; }
  .screen p { font-size: clamp(12px, 1.8vw, 18px); line-height: 1.9; color: #8d897c; }
  .screen .red { color: #a33; }
  .screen button { margin-top: .6em; background: none; border: 1px solid #7c776a; color: #d8d4c8; padding: .7em 2.6em; font: inherit; font-size: clamp(13px, 1.8vw, 17px); cursor: pointer; }
  .screen button:hover { background: #6a1414; border-color: #a33; }
  #title { display: none; text-align: left; }
  #title.on { display: block; }
  #title > * { position: absolute; }
  .tPhoto { left: 7%; top: 11%; width: 47%; aspect-ratio: 3 / 2; background: center / cover no-repeat; border: 1px solid #666; filter: grayscale(1) contrast(1.5) brightness(.8); }
  .tName { right: 12%; top: 10%; writing-mode: vertical-rl; font-family: AppleMyungjo, Batang, "바탕", serif; font-size: clamp(44px, 11vw, 104px); color: #e6e6e6; line-height: 1; animation: jit 2.3s steps(1) infinite; }
  .tSub { right: 30%; top: 13%; writing-mode: vertical-rl; font-family: AppleMyungjo, Batang, serif; font-size: clamp(11px, 1.6vw, 15px); color: #888; }
  @keyframes jit { 0%, 100% { transform: none; } 91% { transform: translate(2px, -1px); } 93% { transform: translate(-2px, 1px); } 95% { transform: none; } }
  #title .tStart { left: 7%; top: 74%; margin: 0; padding: 0; border: 0; background: none; color: #fff; font-size: clamp(14px, 2vw, 19px); letter-spacing: 0; animation: blink 1.2s steps(1) infinite; }
  #title .tStart:hover { background: none; color: #e00; animation: none; }
  .tWarn { right: 4%; bottom: 5%; width: 38%; color: #c00; font-size: clamp(10px, 1.35vw, 13px); line-height: 1.7; }
  .tVer { left: 7%; bottom: 5%; color: #555; font-size: clamp(10px, 1.2vw, 12px); }
  #end.dawn { background: rgba(0, 0, 0, .5); }
  #end h2 { font-family: AppleMyungjo, Batang, serif; font-size: clamp(20px, 4vw, 44px); font-weight: 400; }

  /* ───── 세로로 든 휴대폰 ───── */
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (orientation: portrait) {
    :root { --top: max(7vh, env(safe-area-inset-top, 0px)); --t: calc(var(--top) + 52px); }
    body { align-items: flex-start; padding-top: var(--top); }
    #stage { width: 100vw; }
    #stage.shake { animation: none; }
    #tools button, #btnBag { font-size: 15px; }
    #bagList .item, #bagList .empty { font-size: 15px; }
    #goal { position: fixed; top: calc(var(--top) + 66.67vw + 10px) !important; width: max-content; max-width: 92%; height: auto; line-height: 1.5; padding: .45em 1em !important; font-size: 13px !important; white-space: normal; text-align: center; }
    .nav { font-size: 14px; padding: .55em .9em; }
    .hot::after { font-size: 12px; }
    #blocker, #ov, #scare, #white, #fade, .screen { position: fixed; }
    #dlg { position: fixed; left: 3vw; right: 3vw; bottom: max(3vh, env(safe-area-inset-bottom, 0px)); min-height: 22vh; font-size: 16px; }
    #choices button { padding: .7em 1.1em; font-size: 15px; }
    .poster { width: 80%; font-size: 12px; }
    .phone { width: 58%; font-size: 12px; }
    .keypad { font-size: 17px; }
    #ovClose { font-size: 15px; top: max(3vh, env(safe-area-inset-top, 0px)); }
    .tPhoto { left: 7%; top: var(--t); width: 86%; }
    .tSub { writing-mode: horizontal-tb; left: 7%; right: auto; top: calc(var(--t) + 61vw); font-size: 12px; }
    .tName { right: 8%; top: calc(var(--t) + 60vw); font-size: 22vw; }
    #title .tStart { top: calc(var(--t) + 72vw); font-size: 20px; }
    #title .tOpt { top: calc(var(--t) + 84vw); font-size: 14px; }
    .tWarn { left: 7%; right: 7%; width: auto; bottom: 8%; font-size: 12px; }
    .tVer { bottom: 3%; }
  }

  /* ───── 언어 ───── */
  .poster .tag { white-space: nowrap; }
  .tLang { position: absolute; left: 7%; top: 89%; display: flex; gap: 1.1em; }
  #title .tLang button { margin: 0; padding: 0; border: 0; background: none; color: #777; font-size: clamp(11px, 1.5vw, 14px); letter-spacing: 0; }
  #title .tLang button.cur { color: #fff; text-decoration: underline; }
  html[lang=en] body { font-family: Tahoma, Verdana, Geneva, sans-serif; }
  html[lang=ja] body { font-family: "MS PGothic", "MS Pゴシック", Osaka, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
  html[lang=en] .tSub { writing-mode: horizontal-tb; right: 26%; top: 60%; max-width: 30%; text-align: right; font-family: Georgia, serif; }
  html[lang=en] #mirrorText, html[lang=ja] #mirrorText { letter-spacing: .08em; }
  html[lang=ja] .tSub, html[lang=ja] #end h2 { font-family: "Hiragino Mincho ProN", "MS PMincho", "Yu Mincho", serif; }
  html[lang=en] #end h2 { font-family: Georgia, "Times New Roman", serif; }
  @media (orientation: portrait) {
    .tLang { top: calc(var(--t) + 95vw); }
    #title .tLang button { font-size: 14px; }
    html[lang=en] .tSub { right: auto; max-width: 60%; text-align: left; top: calc(var(--t) + 61vw); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bg"></div><div id="bg2"></div>
    <div id="fog"></div>
    <div id="mirrorText">내가 사라진 날</div>
    <div id="fx"></div>
  </div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="hots"></div>
  <div id="loc"></div>
  <div id="goal"></div>
  <div id="hud"><div id="inv"><button id="btnBag" title="가방"><svg viewBox="0 0 16 16"><path d="M6 6.5V5a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 6.5h10l1.5 8h-13z" fill="currentColor"/><path d="M2.6 9.5h10.8" stroke="#000" stroke-width="1"/><rect x="4.5" y="8.5" width="1.5" height="2.5" fill="#000"/><rect x="10" y="8.5" width="1.5" height="2.5" fill="#000"/></svg><span id="bagN"></span></button><div id="bagList"></div></div><div id="tools">
    <button id="btnHint" title="힌트"><svg viewBox="0 0 16 16"><path d="M5 6a3 3 0 1 1 4.5 2.6C8.5 9.2 8 9.8 8 11" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="12.5" width="2" height="2" fill="currentColor"/></svg></button>
    <button id="btnMute" title="소리 끄기"><svg viewBox="0 0 16 16"><path d="M1 6h3l4-3v10l-4-3H1z" fill="currentColor"/><g class="on" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/><path d="M12.5 3.5a6.5 6.5 0 0 1 0 9"/></g><path class="off" d="M10.5 5.5l4.5 5m0-5l-4.5 5" fill="none" stroke="#e33" stroke-width="1.8"/></svg></button>
    <button id="btnFull" title="전체화면"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </div></div>
  <div id="blocker"></div>
  <div id="dlg"><span id="dlgText"></span><div id="choices"></div><span class="more">▼</span></div>
  <div id="ov"><div id="ovBody"></div><button id="ovClose" title="닫기"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
  <div id="fade"></div>
  <div id="scare"></div>
  <div id="white"></div>

  <div id="end" class="screen">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button id="endBtn">돌아가기</button>
  </div>

  <div id="title" class="screen on">
    <div class="tPhoto"></div>

function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
  // 형광등 웅웅거림 + 지하 공기 소리
  [[50, .05], [100.6, .022], [151, .008]].forEach(([f, g]) => { const o = ac.createOscillator(), v = ac.createGain(); o.frequency.value = f; o.type = 'sawtooth'; v.gain.value = g; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300; o.connect(lp).connect(v).connect(master); o.start(); });
  const n = noiseSrc(4, true), lp = ac.createBiquadFilter(), g = ac.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 180; g.gain.value = .5; n.connect(lp).connect(g).connect(master); n.start();
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .07; lg.gain.value = .25; lfo.connect(lg).connect(g.gain); lfo.start();
  applyMute();
}
function noiseSrc(sec, loop) {
  const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(); s.buffer = b; s.loop = !!loop; return s;
}
function tone(f, dur, type = 'sine', vol = .2, when = 0, f2) {
  if (!ac || muted) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
function burst(dur, freq, vol = .4, when = 0, type = 'lowpass') {
  if (!ac || muted) return; const t = ac.currentTime + when, n = noiseSrc(dur + .1), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + .1);
}

  chime: () => { [659, 523, 587, 392].forEach((f, i) => tone(f, .7, 'sine', .14, i * .45)); },

  breath: () => { burst(1.1, 700, .12, 0, 'bandpass'); burst(1.4, 500, .1, 1.3, 'bandpass'); },

      o.type = 'sawtooth'; o.frequency.setValueAtTime(f * .6, t); o.frequency.exponentialRampToValueAtTime(f * 1.25, t + .12); o.frequency.exponentialRampToValueAtTime(f * .8, t + 1.3);

      g.gain.setValueAtTime(.26, t); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      o.connect(g).connect(master); o.start(t); l.start(t); o.stop(t + 1.5); l.stop(t + 1.5); });
    burst(1.2, 2400, .8, 0, 'highpass'); tone(52, .5, 'sine', .9, 0, 30);

function applyMute() {
  const b = $('#btnMute'); b.classList.toggle('muted', muted); b.title = tr(muted ? '소리 켜기' : '소리 끄기'); store.set('makcha_mute', muted ? '1' : '0');

}

  else if (S.tunnel === 2) { sfx.breath(); alt('tunnel_g', 3);
    await say('……숨소리?', '어둠 속에 무언가 서 있는 것 같기도 하다.', '그만 보는 게 좋겠다.'); }
  else { busy(true); alt('tunnel_g', .1); const w = $('#world'); w.style.transition = 'transform .55s ease-in'; w.style.transform = 'scale(2.8)'; await sleep(520);
    await badEnd('들여다보지 말았어야 했다', '어둠도 당신을 들여다보고 있었다.'); S.tunnel = 0; go('platform', true); }
}
async function office() {
  S.sawNote = true;
  await say('역무실은 불이 꺼져 있고 문은 잠겨 있다.', '유리창 안쪽에 메모가 붙어 있다.', '「순찰 중.\n 셔터 열쇠는 보관함 13번.\n 비밀번호는 그 애한테 물어볼 것.」', '……그 애?');
}
async function lockers() {
  if (S.lockerOpen) return say('13번 보관함은 텅 비어 있다.', '안쪽 벽에 긁힌 자국이 있다.');
  if (S.sawNote) await say('번호를 훑어본다. 1, 2, 3, 5…… 4번이 없다.', '맨 아래 구석 칸이 13번이다. 네 자리 번호 자물쇠가 달려 있다.');
  else await say('번호를 훑어본다. 1, 2, 3, 5…… 4번이 없다.', '다른 칸은 전부 비어 있는데, 맨 아래 구석 13번 칸에만 네 자리 번호 자물쇠가 달려 있다.');
  let code = '';
  const p = overlay(`<div class="keypad"><div class="num">${tr('보관함 13')}</div><div class="disp" id="disp"></div><div class="keys">${[1,2,3,4,5,6,7,8,9,'지움',0,'확인'].map(k => `<button data-k="${k}">${tr(String(k))}</button>`).join('')}</div></div>`);
  $('#ovBody').onclick = e => { const k = e.target.dataset?.k; if (k == null) return; sfx.key();
    if (k === '지움') code = code.slice(0, -1); else if (k === '확인') { if (code === '0417') return closeOv('ok'); sfx.wrong(); code = ''; } else if (code.length < 4) code += k;
    const d = $('#disp'); if (d) d.textContent = code; };
  const r = await p; $('#ovBody').onclick = null;
  if (r !== 'ok') return say(...(S.tap && S.sawPoster ? ['「내가 사라진 날」…… 전단에 날짜가 있었다.'] : S.tap ? ['「내가 사라진 날」…… 그게 언제인지 알아야 한다.', '승강장 게시판에 뭔가 붙어 있었던 것 같다.'] : S.sawNote ? ['번호를 모른다.', '역무실 메모대로라면 「그 애」가 알고 있다. 다른 곳을 더 둘러보자.'] : ['번호를 모른다.', '대합실 왼쪽 역무실 유리창에 뭔가 붙어 있었다. 그것부터 읽어 보자.']));
  S.lockerOpen = true; sfx.open(); busy(true); await sleep(500);
  const h = fxImg('hand', { left: '10%', top: '0%', width: '80%', height: '100%', objectFit: 'cover', opacity: 0, transition: 'opacity .05s, transform .25s', transform: 'scale(.6)' });
  $('#world').classList.add('dark'); await sleep(350); if (tame) sfx.thump(); else { h.style.opacity = 1; h.style.transform = 'scale(1.25)'; sfx.scream(); $('#stage').classList.add('shake'); }
  await sleep(450); $('#stage').classList.remove('shake'); clearFx(); $('#world').classList.remove('dark'); busy(false);
  S.key = S.tag = true; S.inv.push('key', 'tag'); render();
  await say('……!!', '……아무것도 없다. 분명 손이 나왔는데.', '보관함 안에는 녹슨 열쇠와, 플라스틱 이름표가 놓여 있다.', '[셔터 열쇠]와 [이름표]를 얻었다.');
  sfx.buzz(); phoneAlert(); await say('휴대폰이 울렸다.', '(왼쪽 위 가방에서 휴대폰을 꺼내 볼 수 있다.)');
}
async function tap() {
  if (S.tap) return say('물은 저절로 잠겨 있다.', '거울에 김이 서려 있다.');
  S.tap = true; sfx.water(); render();
  await say('수도꼭지를 돌리자 뜨거운 물이 쏟아진다.', '거울에 김이 서린다.', '……김 위로 누군가 손가락으로 쓴 글씨가 떠오른다.', '「내가 사라진 날」');
}
async function mirror() {
  S.mirror++;
  if (S.mirror === 1) { await say('얼룩진 거울. 지친 내 얼굴이 비친다.', S.tap ? '김 서린 글씨: 「내가 사라진 날」' : '뒤쪽 칸막이 문이 전부 닫혀 있다.'); }
  else if (S.mirror === 2) { busy(true); await sleep(1400); alt('restroom_g', .05); sfx.thump(); await sleep(380); altOff(.08); await sleep(500); busy(false);
    await say('……방금 내 뒤에.', '돌아봤지만 아무도 없다.', '더는 거울을 보고 싶지 않다.'); }
  else if (S.mirror === 3) { busy(true); $('#world').classList.add('dark'); await sleep(1800); sfx.whisper(); await sleep(1300);
    await jumpscare(800); $('#world').classList.remove('dark'); await say('……헉, ……헉.', '거울 속에는 다시 내 얼굴뿐이다.'); }
  else await say('보지 않는다.');
}
async function shutter() {
  if (S.shutter) return say('셔터 뒤는 벽이다.', '여기로는 나갈 수 없다.');
  if (!S.key) return say('철제 셔터가 바닥까지 내려와 있다.', '아래쪽에 열쇠 구멍이 있다. 열쇠가 필요하다.');
  S.shutter = true; busy(true); sfx.shutter(); await sleep(1900);
  await go('wall', true);
  await say('열쇠를 돌리자 셔터가 덜컹거리며 올라간다.', '……계단이 없다.', '셔터 뒤는 콘크리트 벽이다.\n벽 가득, 손톱으로 긁은 자국이 나 있다.', '여기서 나가려던 사람이, 나만은 아니었던 모양이다.');
  sfx.chime(); await sleep(1900);
  await say('〈 지금, 무영, 무영역에…… 마지막 열차가 들어오고 있습니다. 〉', '〈 손님 여러분께서는…… 한 분도 빠짐없이…… 승차하여 주시기 바랍니다. 〉');
  sfx.train(); $('#stage').classList.add('shake'); await sleep(900); $('#stage').classList.remove('shake');
  S.trainHere = true; sfx.buzz();
  await say('발밑에서 진동이 올라온다. 승강장에 열차가 들어왔다.', '휴대폰이 또 울린다.', '(가방에서 휴대폰을 꺼내 볼 수 있다.)'); phoneAlert();
  go('concourse', true);
}
async function boardTrain() {
  const c = await choose('문이 열려 있다. 안에는 아무도 없다. 탈까?', ['탄다', '타지 않는다']);
  if (c === 1) return;
  S.ride = 0; await go('train');
  sfx.open(); await say('발을 들이자마자 등 뒤에서 문이 닫혔다.', '열차가 움직이기 시작한다.', '(화면을 눌러 주위를 살핀다)');
}
async function ride() {
  S.ride++;
  if (S.ride <= 3) { busy(true); $('#world').classList.add('dark'); sfx.thump(); await sleep(500); alt('train_g' + S.ride, 0); $('#world').classList.remove('dark'); await sleep(500); busy(false);
    await say(['맨 끝 칸에 누가 서 있다.', '불이 깜빡인 사이, 가까워졌다.', '……바로 앞이다.'][S.ride - 1]); }
  else { await badEnd('막차에는 종점이 없다', '〈 다음 역은, 무영, 무영역입니다. 〉'); S.ride = 0; go('platform', true); }
}
async function trueEnd() {
  busy(true); sfx.key(); await overlayTimed(posterHtml(true), 2200);
  await say('이름표를 전단의 지워진 자리에 꽂았다.', '「윤서하」.');
  $('#world').classList.remove('flicker'); await sleep(200); alt('platform_g', 2.5); sfx.whisper(); await sleep(2600);
  await say('승강장 끝에, 그 애가 서 있다.', '이번에는 다가오지 않는다.', '「……아무도, 내 이름을 안 불러 줬어.」', '「……고마워.」');
  sfx.train(); S.trainHere = false; render(); altOff(2.5); await sleep(2600);
  clearFx();
  await say('열차는 문을 닫고, 그 애를 태운 채 터널 속으로 사라졌다.', '위쪽에서 셔터 올라가는 소리가 들린다.');
  sfx.shutter(); await sleep(1200);
  await go('exit_dawn', true); sfx.bell();
  await say('이번에는 계단이 있었다.', '휴대폰 시계가 다시 움직이기 시작한다. 04:17.', '첫차가 다니기 전의, 조용한 새벽이었다.');
  $('#endTitle').textContent = tr('막차 — 끝'); $('#endText').innerHTML = tr('플레이해 주셔서 감사합니다.'); $('#endBtn').textContent = tr('처음으로');
  $('#end').classList.add('on', 'dawn'); busy(false);
  const t = setTimeout(async () => { sfx.buzz(); $('#end').classList.remove('dawn'); $('#endText').innerHTML = '<span style="color:#c44">' + tr('새 메시지 · 발신자 표시 없음') + '</span><br><br>' + tr('「다음 막차에서 또 봐」'); await sleep(1500); await jumpscare(600); }, 7000);
  $('#endBtn').onclick = () => { clearTimeout(t); location.reload(); };
}
async function overlayTimed(html, ms) { $('#ovBody').innerHTML = html; $('#ov').classList.add('on'); $('#ovClose').style.display = 'none'; await sleep(ms); $('#ov').classList.remove('on'); $('#ovClose').style.display = ''; $('#ovBody').innerHTML = ''; }

/* ───────── 시작 ───────── */
function showTame() { $('#btnTame').textContent = (tame ? '■' : '□') + ' ' + tr('순한 모드 (깜짝 장면·비명 끄기)'); }
$('#btnTame').onclick = () => { tame = !tame; store.set('makcha_tame', tame ? '1' : '0'); showTame(); };
showTame();
document.querySelectorAll('#tLang button').forEach(b => b.onclick = () => { LANG = b.dataset.l; applyLang(); });
applyLang();
$('#btnStart').onclick = async () => {
  if (ac) return; $('#btnStart').blur();
  initAudio(); S = fresh(); render(); document.body.classList.add('playing');
  $('#fade').classList.add('on'); $('#title').classList.remove('on'); sfx.train();
  await sleep(1600); $('#fade').classList.remove('on'); await sleep(500);
  intro();
};
window.__game = { get S() { return S; }, go, render, jumpscare };
</script>
